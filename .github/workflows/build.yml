name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache JieLi toolchain
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: ~/.jieli
          key: jieli-toolchain-${{ hashFiles('tools/toolchain.sha256') }}

      - name: Fetch JieLi toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: sh tools/fetch_toolchain.sh

      - name: Show toolchain layout
        run: |
          echo "FM1_PI32_TOOLCHAIN=$HOME/.jieli" >> "$GITHUB_ENV"
          find ~/.jieli -maxdepth 4 -type d -name bin -print -exec ls {} \;

      - name: Build firmware
        run: python3 tools/build.py --clean --package

      - name: Package info
        run: |
          ls -la build/
          (cd build && sha256sum *.fwsc *.bin | tee SHA256SUMS)

      - name: Memory report
        run: |
          python3 tools/build.py --help >/dev/null
          echo "image bytes: $(stat -c %s build/app.bin)"
          grep -nE "^ *\.(ram0_data|ram0_bss|cache_ram|data|bss)[ .]|HEAP|_end *=" build/sdk.map | head -n 40 || true

      - uses: actions/upload-artifact@v4
        with:
          name: erisian-${{ github.sha }}
          path: |
            build/*.fwsc
            build/*.bin
            build/sdk.map
            build/SHA256SUMS
            LICENSE
            THIRD_PARTY.md
            LICENSES/Apache-2.0.txt
          if-no-files-found: error

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and run host tests
        run: sh tests/run_tests.sh

  # Boot the new package in the FM-1 emulator (joakimeriksson/fm1-emu, MIT)
  # before anyone flashes it. Report-only for now: read the log and snapshots.
  emulator:
    needs: firmware
    runs-on: ubuntu-latest
    env:
      FM1_EMU_REPO: https://github.com/joakimeriksson/fm1-emu
      FM1_EMU_REV: 2ed986561c6f26596d37fd306fac0e7558a41356
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: erisian-${{ github.sha }}
          path: pkg

      - name: Cache emulator build
        id: emu-cache
        uses: actions/cache@v4
        with:
          path: emu/target/release/fm1-emu
          key: fm1-emu-${{ env.FM1_EMU_REV }}

      - name: Build emulator
        if: steps.emu-cache.outputs.cache-hit != 'true'
        run: |
          git init -q emu && cd emu
          git fetch -q --depth 1 "$FM1_EMU_REPO" "$FM1_EMU_REV"
          git checkout -q FETCH_HEAD
          cargo build --release --locked -p fm1-emu

      - name: Boot package
        run: |
          mkdir -p run/work && cd run
          EMU=../emu/target/release/fm1-emu
          "$EMU" --version || true
          echo "== package directory"
          FM1_FWSC_DIR=1 "$EMU" --fwsc ../pkg/build/fm1.fwsc --ms 50 --quiet 2>&1 | head -n 60 || true
          echo "== 3 s boot"
          set +e
          "$EMU" --fwsc ../pkg/build/fm1.fwsc --ms 3000 --snap 500,1500,2900 \
            --wav work/out.wav > work/boot.log 2>&1
          echo "exit code: $?" | tee -a work/boot.log
          set -e
          tail -n 120 work/boot.log
          ls -la work

      - name: First instructions
        run: |
          cd run
          ../emu/target/release/fm1-emu --fwsc ../pkg/build/fm1.fwsc --trace 400 --steps 400 \
            > work/trace.log 2>&1 || true
          tail -n 80 work/trace.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-${{ github.sha }}
          path: run/work/
