name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache JieLi toolchain
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: ~/.jieli
          key: jieli-toolchain-${{ hashFiles('tools/toolchain.sha256') }}

      - name: Fetch JieLi toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: sh tools/fetch_toolchain.sh

      - name: Toolchain
        run: echo "FM1_PI32_TOOLCHAIN=$HOME/.jieli" >> "$GITHUB_ENV"

      - name: Build ERISIAN
        run: |
          VERSION="0.1.0-${GITHUB_SHA::7}"
          python3 tools/build.py --clean --package --app app --output build/erisian \
            --version-string "$VERSION"

      - name: Build sine example (platform reference)
        run: python3 tools/build.py --clean --package --app examples --output build/sine

      - name: Build uploader page
        run: python3 tools/uploader/build_page.py build/dist/erisian-uploader.html

      - name: Collect
        run: |
          mkdir -p build/dist
          cp build/erisian/fm1.fwsc build/dist/erisian.fwsc
          cp build/sine/fm1.fwsc build/dist/sine-example.fwsc
          cp LICENSE THIRD_PARTY.md build/dist/
          cp LICENSES/Apache-2.0.txt build/dist/
          (cd build/dist && sha256sum *.fwsc *.html | tee SHA256SUMS)

      - name: Audio code stays in RAM (ERISIAN)
        run: |
          OBJDUMP=$(find ~/.jieli -path '*/bin/objdump' -o -path '*/bin/llvm-objdump' | grep -m1 . || true)
          test -n "$OBJDUMP" || { echo "::error::no objdump in the toolchain"; exit 1; }
          python3 tools/check_audio_code.py "$OBJDUMP" build/erisian/sdk.elf

      - name: Memory report (ERISIAN)
        run: python3 tools/mem_report.py build/erisian/sdk.map build/erisian/app.bin

      - uses: actions/upload-artifact@v4
        with:
          name: erisian-${{ github.sha }}
          path: build/dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: build-details-${{ github.sha }}
          path: |
            build/erisian/sdk.map
            build/erisian/app.bin
            build/sine/sdk.map

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and run host tests
        run: sh tests/run_tests.sh

      - uses: actions/upload-artifact@v4
        with:
          name: demo-audio-${{ github.sha }}
          path: |
            build-host/demo.wav
            build-host/engines.wav

  # Boot each package in the FM-1 emulator (joakimeriksson/fm1-emu, MIT)
  # before anyone flashes it. A halt or a repeated reset fails the build.
  emulator:
    needs: firmware
    runs-on: ubuntu-latest
    env:
      FM1_EMU_REPO: https://github.com/joakimeriksson/fm1-emu
      FM1_EMU_REV: 2ed986561c6f26596d37fd306fac0e7558a41356
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: erisian-${{ github.sha }}
          path: pkg

      - name: Cache emulator build
        id: emu-cache
        uses: actions/cache@v4
        with:
          path: emu/target/release/fm1-emu
          key: fm1-emu-${{ env.FM1_EMU_REV }}

      - name: Build emulator
        if: steps.emu-cache.outputs.cache-hit != 'true'
        run: |
          git init -q emu && cd emu
          git fetch -q --depth 1 "$FM1_EMU_REPO" "$FM1_EMU_REV"
          git checkout -q FETCH_HEAD
          cargo build --release --locked -p fm1-emu

      - name: Boot ERISIAN
        run: |
          mkdir -p run/work && cd run
          set +e
          # Boot, then PLAY at 1.5 s: the starter beat must sound.
          FM1_RESET_TRACE=1 ../emu/target/release/fm1-emu --fwsc ../pkg/erisian.fwsc --ms 4500 \
            --snap 4400 --keys '300:pot:700,1500-1600:PLAY' \
            --wav work/erisian.wav > work/erisian.log 2>&1
          set -e
          grep -E "^(chip reset|time|lcd|wav|halt reason)" work/erisian.log || tail -n 30 work/erisian.log
          python3 ../tools/emu_report.py work/lcd_4400.bmp
          python3 ../tools/emu_report.py --expect-sound work/erisian.wav || EMU_FAIL=1
          if grep -q "halt reason" work/erisian.log; then
            tail -n 60 work/erisian.log
            echo "::error::ERISIAN halted in the emulator; do not flash this build"; exit 1
          fi
          # FM1_RESET_TRACE prints "chip reset at N ms (CAUSE)"; the summary repeats
          # each reset as "chip reset at step ...", so count the trace lines only.
          resets=$(grep -cE "^chip reset at [0-9]+ ms" work/erisian.log || true)
          if [ "$resets" -gt 1 ]; then
            echo "::error::ERISIAN reset $resets times in 4.5 s (boot loop?)"; exit 1
          fi
          if [ -n "${EMU_FAIL:-}" ]; then
            echo "::error::ERISIAN made no sound after PLAY"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-${{ github.sha }}
          path: run/work/
